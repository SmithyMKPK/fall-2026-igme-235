<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-4-HW</title>
	<style>
		body{border:1px solid gray;}
	</style>
</head>
<body>
<h1>My Favorites</h1>
<h2>My Favorite Colors</h2>

<ol id="colorsList">
	
</ol>

<h2>My Favorite Foods</h2>

<ol id="foodsList">
	
</ol>

<h2>My Favorite Links</h2>

<ol id="linksList">
	
</ol>

<script>
"use strict";
let colors = ["red","green","blue","purple", "teal"];
let foods = ["banana", "pizza", "cantaloupe", "grape"]; // add some foods
let foodList = document.getElementById('foodsList');
let colorList = document.getElementById('colorsList');
let linkList = document.getElementById('linksList');


let links = {
		"RIT": "http://www.rit.edu",
		"RWAG" : "https://www.facebook.com/RWAGclub",
		"New Media Club" : "http://newmediaclub.cias.rit.edu"
	}

const createList = (listElement, array = ["puppydogs", "butterfies", "lolipops"]) => {
    for (let i = 0; i < array.length; i++){
        let newListElement = document.createElement('li'); 
        newListElement.textContent = array[i];
        listElement.append(newListElement);
    }
}

createList(foodsList, foods);
createList(colorList, colors);

for (const [key, value] of Object.entries(links)){
    let newItem = document.createElement('li');
    let link = document.createElement('a');

    link.textContent = key;
    link.href = value

    newItem.append(link);
    linksList.append(newItem);
}

</script>
</body>
</html>
