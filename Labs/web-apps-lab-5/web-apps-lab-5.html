
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-5</title>
	<style>
		body{
			font-family:sans-serif;
		}
		#colorform{
			background-color:#dfecdf;
			color: #111;
			padding:1em;width:400px;
		}
		#colorform p#info{
			background-color:white;
			color: black;
			width:300px;
			height:100px;
			padding:.5em;
		}
		
		#colorform legend{ 
			font-weight:bold;
			font-size:1.2em;
		}
	</style>
</head>
<body>

<div id="colorform">
	<legend>Choose your favorite color!</legend>
	<p><input type="radio" name="colorGroup" id="colorGroupRed" value="red" /> Red</p>
	<p><input type="radio" name="colorGroup" id="colorGroupGreen" value="green" /> Green</p>
	<p><input type="radio" name="colorGroup" id="colorGroupBlue" value="blue" /> Blue</p>
	<p><button id="colorButton" type="button">Submit</button></p>
	<p id="info"></p>
</div>

<script>
let radioButtons = document.querySelectorAll('input');
let submitButton = document.getElementById('colorButton');
let infoSection = document.getElementById('info');
let legend = document.querySelector('legend');

function onSubmitButtonPressed(){
    for (let i = 0; i < radioButtons.length; i++){
    if (radioButtons[i].checked){
		legend.style.color = radioButtons[i].value;
		changeColorText(radioButtons[i].value, true);
	}
	}
}

function changeColorText(color, isFinalText = false){
	if (isFinalText === true){
		infoSection.textContent = "Your FINAL CHOICE is " + "\"" + color + "\"!";
	}
	else{
		infoSection.textContent = "You have selected \"" + color + "\"!"
	}
}

submitButton.addEventListener('click', () => onSubmitButtonPressed());


for (let i = 0; i < radioButtons.length; i++){
    let currentButton = radioButtons[i];
    currentButton.addEventListener('change', () => changeColorText(currentButton.value));
}

</script>
</body>
</html>
